<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Uzma Yasmin">
    <title>Live Code Runner - DevStudio | Founder Uzma Yasmin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d0d0d; color: #e5e5e5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .gold-text { color: #d4af37; }
        .gold-bg { background-color: #d4af37; color: #0d0d0d; }
        .gold-bg:hover { background-color: #f3e5ab; }
        textarea { background-color: #171717; color: #f5f5f5; border: 1px solid #333333; font-family: monospace; }
        textarea:focus { outline: none; border-color: #d4af37; }
        .preview-frame { background-color: #ffffff; border: 1px solid #333333; }
        .card-box { background-color: #171717; border: 1px solid #333333; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-6">

    <!-- Header -->
    <nav class="max-w-4xl mx-auto w-full flex justify-between items-center py-4 border-b border-neutral-800">
        <div>
            <h2 class="text-xl font-bold gold-text">DevStudio.io</h2>
        </div>
        <div class="space-x-4 text-sm">
            <a href="index.html" class="text-neutral-400 hover:text-[#d4af37] transition">Home</a>
            <a href="analyzer.html" class="text-neutral-400 hover:text-[#d4af37] transition">Analyzer</a>
            <a href="runner.html" class="gold-text font-semibold">Code Runner</a>
            <a href="about.html" class="text-neutral-400 hover:text-[#d4af37] transition">About Us</a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-4xl mx-auto w-full space-y-6 my-6">
        <div class="text-center">
            <h1 class="text-2xl font-bold gold-text">Live HTML/CSS Code Runner</h1>
            <p class="text-xs text-neutral-400 mt-1">Apna HTML code yahan paste karein aur foran live output dekhein.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Code Input Box -->
            <div class="flex flex-col space-y-2">
                <label class="text-xs font-semibold uppercase gold-text">Enter HTML Code:</label>
                <textarea id="codeInput" rows="12" class="w-full p-4 rounded-xl shadow-lg text-xs" placeholder="<h1>Hello World</h1>&#10;<p style='color:red;'>This is a test.</p>">&lt;h1 style=&quot;color: #d4af37;&quot;&gt;Hello World!&lt;/h1&gt;&#10;&lt;p&gt;Yeh mera live code runner output hai.&lt;/p&gt;</textarea>
                <button onclick="runCode()" class="w-full py-2.5 rounded-xl font-semibold text-xs gold-bg shadow-lg transition">Run Code 🚀</button>
            </div>

            <!-- Live Output Preview -->
            <div class="flex flex-col space-y-2">
                <label class="text-xs font-semibold uppercase gold-text">Live Output Preview:</label>
                <div class="w-full h-[275px] rounded-xl overflow-hidden preview-frame shadow-lg">
                    <iframe id="outputPreview" class="w-full h-full border-0"></iframe>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center text-xs text-neutral-600 py-4">
        &copy; 2026 DevStudio. Founder: Uzma Yasmin.
    </footer>

    <!-- Script to Run Code -->
    <script>
        function runCode() {
            let code = document.getElementById('codeInput').value;
            let iframe = document.getElementById('outputPreview');
            let frameDoc = iframe.contentDocument || iframe.contentWindow.document;
            frameDoc.open();
            frameDoc.write(code);
            frameDoc.close();
        }

        // Run default code on load
        window.onload = function() {
            runCode();
        }
    </script>
</body>
</html>
